<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Fruit Hub</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:Arial,sans-serif;
}

body{
  background:#f5f7f5;
  color:#222;
}

header{
  background:#16833b;
  color:white;
  padding:18px 15px;
  text-align:center;
}

header h1{
  font-size:28px;
}

header p{
  margin-top:5px;
  font-size:14px;
}

.container{
  max-width:650px;
  margin:auto;
  padding:15px;
}

.card{
  background:white;
  padding:15px;
  margin-bottom:12px;
  border-radius:14px;
  box-shadow:0 2px 8px rgba(0,0,0,.08);
}

.product{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
}

.product-info h3{
  font-size:18px;
}

.price{
  color:#16833b;
  font-weight:bold;
  margin-top:5px;
}

.controls{
  display:flex;
  align-items:center;
  gap:8px;
}

.controls button{
  border:0;
  background:#16833b;
  color:white;
  width:32px;
  height:32px;
  border-radius:8px;
  font-size:20px;
}

.qty{
  min-width:25px;
  text-align:center;
  font-weight:bold;
}

input, textarea{
  width:100%;
  padding:12px;
  margin-top:10px;
  border:1px solid #ddd;
  border-radius:9px;
  font-size:15px;
}

textarea{
  min-height:80px;
  resize:vertical;
}

.total{
  font-size:21px;
  font-weight:bold;
  color:#16833b;
  margin:15px 0;
}

.order-btn{
  width:100%;
  border:0;
  padding:15px;
  border-radius:10px;
  background:#25D366;
  color:white;
  font-size:18px;
  font-weight:bold;
}

.clear-btn{
  width:100%;
  border:0;
  padding:12px;
  margin-top:8px;
  border-radius:10px;
  background:#eee;
  font-size:15px;
}

.empty{
  text-align:center;
  color:#777;
  padding:15px;
}

footer{
  text-align:center;
  padding:20px;
  color:#777;
  font-size:13px;
}
</style>
</head>

<body>

<header>
  <h1>🍎 The Fruit Hub</h1>
  <p>Fresh Fruits • Fresh Juice • Fast Delivery</p>
</header>

<div class="container">

  <div class="card">
    <h2>🍓 Fresh Fruits</h2>
  </div>

  <div id="products"></div>

  <div class="card">
    <h2>🛒 Your Cart</h2>

    <div id="cart"></div>

    <div class="total">
      Total: ₹<span id="total">0</span>
    </div>

    <h3>Customer Details</h3>

    <input id="name" type="text" placeholder="Your Name">

    <input id="phone" type="tel" placeholder="Mobile Number">

    <textarea id="address" placeholder="Delivery Address"></textarea>

    <button class="order-btn" onclick="placeOrder()">
      📲 Order on WhatsApp
    </button>

    <button class="clear-btn" onclick="clearCart()">
      Clear Cart
    </button>
  </div>

</div>

<footer>
  © 2026 The Fruit Hub
</footer>

<script>

const products = [
  {name:"🍎 Apple", price:250, unit:"kg"},
  {name:"🍌 Banana", price:60, unit:"dozen"},
  {name:"❤️ Anar", price:200, unit:"kg"},
  {name:"🥭 Amrud", price:150, unit:"kg"},
  {name:"🍉 Kalingad", price:100, unit:"piece"},
  {name:"🥥 Nariyal Pani", price:80, unit:"piece"},
  {name:"🍊 Orange", price:120, unit:"kg"},
  {name:"🍋 Mosambi", price:100, unit:"kg"},
  {name:"🍐 Papaya", price:80, unit:"kg"}
];

let cart = {};

function loadProducts(){

  const container = document.getElementById("products");

  container.innerHTML = "";

  products.forEach((product,index)=>{

    const quantity = cart[index] || 0;

    container.innerHTML += `
      <div class="card">
        <div class="product">

          <div class="product-info">
            <h3>${product.name}</h3>
            <div class="price">
              ₹${product.price} / ${product.unit}
            </div>
          </div>

          <div class="controls">

            <button onclick="changeQty(${index},-1)">
              −
            </button>

            <span class="qty">
              ${quantity}
            </span>

            <button onclick="changeQty(${index},1)">
              +
            </button>

          </div>

        </div>
      </div>
    `;

  });

}

function changeQty(index,change){

  const current = cart[index] || 0;

  const newQty = current + change;

  if(newQty <= 0){
    delete cart[index];
  }else{
    cart[index] = newQty;
  }

  updateCart();

}

function updateCart(){

  loadProducts();

  const cartDiv = document.getElementById("cart");

  let total = 0;
  let html = "";

  Object.keys(cart).forEach(index=>{

    const product = products[index];
    const qty = cart[index];

    const itemTotal = product.price * qty;

    total += itemTotal;

    html += `
      <div style="
        display:flex;
        justify-content:space-between;
        padding:8px 0;
        border-bottom:1px solid #eee;
      ">
        <span>
          ${product.name} × ${qty}
        </span>

        <b>
          ₹${itemTotal}
        </b>
      </div>
    `;

  });

  if(html === ""){
    html = `<div class="empty">Your cart is empty 🛒</div>`;
  }

  cartDiv.innerHTML = html;

  document.getElementById("total").innerText = total;

}

function clearCart(){

  cart = {};

  updateCart();

}

function placeOrder(){

  const name = document.getElementById("name").value.trim();
  const phone = document.getElementById("phone").value.trim();
  const address = document.getElementById("address").value.trim();

  if(Object.keys(cart).length === 0){

    alert("Please add at least one product to your cart.");

    return;

  }

  if(name === "" || phone === "" || address === ""){

    alert("Please fill Name, Mobile Number and Address.");

    return;

  }

  let total = 0;

  let message =
`🍎 *THE FRUIT HUB - NEW ORDER*

👤 Name: ${name}
📱 Mobile: ${phone}
📍 Address: ${address}

🛒 *Order Details:*
`;

  Object.keys(cart).forEach(index=>{

    const product = products[index];
    const qty = cart[index];

    const itemTotal = product.price * qty;

    total += itemTotal;

    message +=
`\n${product.name} × ${qty} ${product.unit} = ₹${itemTotal}`;

  });

  message +=
`\n\n💰 *Total: ₹${total}*

🚚 Free Delivery
`;

  // Replace this number with your WhatsApp number
  const whatsappNumber = "917208449882";

  const url =
    "https://wa.me/" +
    whatsappNumber +
    "?text=" +
    encodeURIComponent(message);

  window.open(url,"_blank");

}

updateCart();

</script>

</body>
</html>
